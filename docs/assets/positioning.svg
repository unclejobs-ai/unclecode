<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>UncleCode positioning vs Cursor / Codex</title>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="760" height="460" fill="#ffffff" rx="14"/>

  <text x="380" y="38" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">UncleCode가 이기는 곳</text>
  <text x="380" y="60" text-anchor="middle" fill="#64748b" font-size="12">검사 가능한 컨텍스트 · 터미널 네이티브 · 로컬 증거 — Cursor/Codex와의 겹침</text>

  <!-- Cursor circle (sky) -->
  <circle cx="250" cy="240" r="140" fill="#dbeafe" fill-opacity="0.65" stroke="#3b82f6" stroke-width="2"/>
  <!-- Codex circle (violet) -->
  <circle cx="510" cy="240" r="140" fill="#ede9fe" fill-opacity="0.65" stroke="#8b5cf6" stroke-width="2"/>
  <!-- UncleCode circle (teal) - overlaps both -->
  <circle cx="380" cy="290" r="150" fill="#ccfbf1" fill-opacity="0.7" stroke="#0d9488" stroke-width="2.5"/>

  <!-- Labels -->
  <text x="190" y="150" text-anchor="middle" fill="#1e40af" font-size="15" font-weight="700">Cursor Agent</text>
  <text x="570" y="150" text-anchor="middle" fill="#5b21b6" font-size="15" font-weight="700">Codex CLI</text>
  <text x="380" y="440" text-anchor="middle" fill="#0f766e" font-size="16" font-weight="700">UncleCode</text>

  <!-- Cursor-only (top-left, outside overlap) -->
  <text x="150" y="220" text-anchor="middle" fill="#1e3a8a" font-size="11">IDE 네이티브</text>
  <text x="150" y="238" text-anchor="middle" fill="#1e3a8a" font-size="11">브라우저/웹 도구</text>
  <text x="150" y="256" text-anchor="middle" fill="#1e3a8a" font-size="11">계정 기반 인증</text>

  <!-- Codex-only (top-right) -->
  <text x="610" y="220" text-anchor="middle" fill="#4c1d95" font-size="11">클라우드 샌드박스</text>
  <text x="610" y="238" text-anchor="middle" fill="#4c1d95" font-size="11">관리형 도구</text>
  <text x="610" y="256" text-anchor="middle" fill="#4c1d95" font-size="11">병렬 클라우드 태스크</text>

  <!-- Center overlap = shared by all -->
  <text x="380" y="285" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="600">공통</text>
  <text x="380" y="302" text-anchor="middle" fill="#334155" font-size="10">LLM 턴 · 도구 루프</text>
  <text x="380" y="318" text-anchor="middle" fill="#334155" font-size="10">멀티 에이전트</text>

  <!-- UncleCode-only (bottom, not in Cursor/Codex overlap) -->
  <text x="380" y="378" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="600">UncleCode만</text>
  <text x="380" y="395" text-anchor="middle" fill="#115e59" font-size="10">/context 다음-호출 패킷 검사</text>
  <text x="380" y="410" text-anchor="middle" fill="#115e59" font-size="10">런북이 곧 계약 · 한국어 우선</text>
  <text x="380" y="425" text-anchor="middle" fill="#115e59" font-size="10">repo-local 증거 JSON · qa:health</text>
</svg>
