<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>UncleCode package dependency DAG</title>
  <defs>
    <marker id="adag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#0f172a" rx="14"/>
  <text x="450" y="34" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">패키지 의존성 DAG — 위에서 아래로만 흐른다</text>
  <text x="450" y="54" text-anchor="middle" fill="#94a3b8" font-size="11">제공자 코드는 CLI 인증/UI에 직접 의존하지 않는다 (타입화된 런타임 설정으로만 소통)</text>

  <!-- Layer 0: contracts -->
  <rect x="370" y="75" width="160" height="44" rx="8" fill="#1e293b" stroke="#7dd3fc" stroke-width="2"/>
  <text x="450" y="95" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="700">@unclecode/contracts</text>
  <text x="450" y="111" text-anchor="middle" fill="#94a3b8" font-size="10">공유 타입 · 의존성 맨 아래</text>

  <!-- Layer 1: core deps -->
  <g font-size="11">
    <rect x="40" y="160" width="150" height="44" rx="8" fill="#082f49" stroke="#0369a1"/>
    <text x="115" y="180" text-anchor="middle" fill="#7dd3fc" font-weight="600">config-core</text>
    <text x="115" y="196" text-anchor="middle" fill="#bae6fd" font-size="10">모드·모델 설정</text>

    <rect x="210" y="160" width="150" height="44" rx="8" fill="#082f49" stroke="#0369a1"/>
    <text x="285" y="180" text-anchor="middle" fill="#7dd3fc" font-weight="600">policy-engine</text>
    <text x="285" y="196" text-anchor="middle" fill="#bae6fd" font-size="10">읽기 가드·셸 정책</text>

    <rect x="380" y="160" width="150" height="44" rx="8" fill="#082f49" stroke="#0369a1"/>
    <text x="455" y="180" text-anchor="middle" fill="#7dd3fc" font-weight="600">session-store</text>
    <text x="455" y="196" text-anchor="middle" fill="#bae6fd" font-size="10">메모리 SQLite+JSONL</text>

    <rect x="550" y="160" width="150" height="44" rx="8" fill="#052e16" stroke="#166534"/>
    <text x="625" y="180" text-anchor="middle" fill="#86efac" font-weight="600">memory-bus</text>
    <text x="625" y="196" text-anchor="middle" fill="#bbf7d0" font-size="10">절차적 SOP·합성</text>

    <rect x="720" y="160" width="150" height="44" rx="8" fill="#115e59" stroke="#0d9488" stroke-width="2"/>
    <text x="795" y="180" text-anchor="middle" fill="#5eead4" font-weight="700">context-broker</text>
    <text x="795" y="196" text-anchor="middle" fill="#99f6e4" font-size="10">패킷 조립 · 핵심 객체</text>
  </g>

  <!-- Layer 2: orchestrator -->
  <rect x="340" y="245" width="220" height="48" rx="8" fill="#451a03" stroke="#b45309" stroke-width="2"/>
  <text x="450" y="267" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="700">@unclecode/orchestrator</text>
  <text x="450" y="283" text-anchor="middle" fill="#fef3c7" font-size="10">워크 셸 엔진 · 턴 오케스트레이션 · 팀 러너</text>

  <!-- Layer 3: tui + providers -->
  <g font-size="11">
    <rect x="210" y="320" width="200" height="44" rx="8" fill="#1e293b" stroke="#64748b"/>
    <text x="310" y="340" text-anchor="middle" fill="#e2e8f0" font-weight="600">@unclecode/tui</text>
    <text x="310" y="356" text-anchor="middle" fill="#cbd5e1" font-size="10">터미널 UI</text>

    <rect x="490" y="320" width="200" height="44" rx="8" fill="#1e293b" stroke="#64748b"/>
    <text x="590" y="340" text-anchor="middle" fill="#e2e8f0" font-weight="600">@unclecode/providers</text>
    <text x="590" y="356" text-anchor="middle" fill="#cbd5e1" font-size="10">OpenAI · Anthropic · Gemini</text>
  </g>

  <!-- App layer -->
  <rect x="690" y="320" width="180" height="44" rx="8" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="780" y="340" text-anchor="middle" fill="#bfdbfe" font-weight="600">apps/unclecode-cli</text>
  <text x="780" y="356" text-anchor="middle" fill="#dbeafe" font-size="10">진입점</text>

  <!-- Rust core (side) -->
  <rect x="40" y="320" width="150" height="44" rx="8" fill="#1e293b" stroke="#facc15" stroke-dasharray="4 3"/>
  <text x="115" y="340" text-anchor="middle" fill="#fde68a" font-weight="600">rust/unclecode-core</text>
  <text x="115" y="356" text-anchor="middle" fill="#fef3c7" font-size="10">rust-command로 호출</text>

  <!-- Arrows -->
  <line x1="450" y1="119" x2="115" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#adag)"/>
  <line x1="450" y1="119" x2="285" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#adag)"/>
  <line x1="450" y1="119" x2="455" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#adag)"/>
  <line x1="450" y1="119" x2="625" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#adag)"/>
  <line x1="450" y1="119" x2="795" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#adag)"/>

  <line x1="455" y1="204" x2="450" y2="243" stroke="#475569" stroke-width="1.5" marker-end="url(#adag)"/>
  <line x1="625" y1="204" x2="455" y2="243" stroke="#475569" stroke-width="1.5" marker-end="url(#adag)"/>
  <line x1="795" y1="204" x2="460" y2="243" stroke="#475569" stroke-width="1.5" marker-end="url(#adag)"/>

  <line x1="440" y1="293" x2="310" y2="318" stroke="#475569" stroke-width="1.5" marker-end="url(#adag)"/>
  <line x1="460" y1="293" x2="590" y2="318" stroke="#475569" stroke-width="1.5" marker-end="url(#adag)"/>
  <line x1="500" y1="293" x2="780" y2="318" stroke="#475569" stroke-width="1.5" marker-end="url(#adag)"/>

  <!-- Rust bridge dashed -->
  <path d="M115 320 Q 280 280 340 270" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#adag)"/>
  <text x="220" y="295" fill="#facc15" font-size="9" font-style="italic">guidance·mode·intent</text>
</svg>
